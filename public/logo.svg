  <path d="M112 52 Q115 34 128 38" stroke="#12A36A" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M112 52 Q126 47 130 58" stroke="#12A36A" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M112 52 Q107 40 97 43" stroke="#12A36A" stroke-width="4" stroke-linecap="round" fill="none"/>

  <defs>
    <linearGradient id="navyGrad" x1="0" y1="27" x2="0" y2="193" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0E4094"/>
      <stop offset="100%" stop-color="#0A2860"/>
    </linearGradient>
    <linearGradient id="upperGrad" x1="70" y1="104" x2="158" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0E4094"/>
